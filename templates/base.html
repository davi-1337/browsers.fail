<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>{% block title %}browsers.fail{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2309090b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237dd3fc'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-dot"></span>browsers.fail
      </a>

      <nav class="nav" aria-label="sections">
        {% set q = request.args.get('q', '') %}
        <a href="{{ url_for('firefox_index') }}"
           class="{{ 'active' if request.path.startswith('/firefox') or 'browser:firefox' in q else '' }}">firefox</a>
        <a href="{{ url_for('webkit_index') }}"
           class="{{ 'active' if request.path.startswith('/webkit') or 'browser:webkit' in q else '' }}">webkit</a>
        <a href="{{ url_for('search') }}"
           class="{{ 'active' if request.path == '/search' and 'browser:' not in q else '' }}">search</a>
      </nav>

      <form class="quick-search" action="{{ url_for('search') }}" method="get" role="search">
        <input id="quick-search" type="search" name="q" value="{{ request.args.get('q', '') }}"
               placeholder="search..." aria-label="search" autocomplete="off">
        <button type="submit" aria-label="submit search">↵</button>
      </form>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>public data from bugzilla.mozilla.org and the WebKit repository</span>
      <span class="muted">{{ stats.total }} items indexed</span>
    </div>
  </footer>
</body>
</html>
